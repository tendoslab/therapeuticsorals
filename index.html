<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thera Orals Simulator</title>
<meta name="description" content="Oral-exam style case simulator for therapeutic prescribing by optometrists in Australia, built from candidate recalls, mock orals and case-study notes.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#1e3a8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#sim" aria-label="Thera Orals home"><img src="img/favicon.svg" alt="">Thera Orals</a>
    <nav class="nav" aria-label="Main">
      <a href="#sim">Oral simulator</a>
      <a href="#review">My mistakes<span class="badge" id="miss-badge" hidden></span></a>
      <a href="#mastered">Mastered<span class="badge good" id="master-badge" hidden></span></a>
      <a href="#bank">Recall bank</a>
      <a href="#audit">Answer audit</a>
      <a href="#guide">Exam guide</a>
      <a href="#play">Play</a>
    </nav>
    <div class="status">
      <span class="pill-stat timer" id="timer-pill" hidden></span>
      <span class="pill-stat" id="score-pill" hidden></span>
      <button class="theme-btn" data-act="theme" aria-label="Toggle light or dark theme">◐ Theme</button>
    </div>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<footer class="foot">Study aid only. Doses, scheduling, PBS listings and OBA/RANZCO requirements change. Verify against the current AMH, eTG, product information, OBA guidelines and your course notes.</footer>
