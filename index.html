<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thera Orals Simulator</title>
    <meta name="description" content="Oral-exam style case simulator for therapeutic prescribing by optometrists in Australia, built from 2018–2025 recalls.">
    <link rel="stylesheet" href="css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 py-3 px-4 sm:px-6 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-wrap gap-3 justify-between items-center">
            <button onclick="goHome()" class="flex items-center gap-3 text-left">
                <div class="bg-blue-900 text-white p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight leading-tight">Therapeutics Orals Simulator</h1>
                    <p class="text-xs text-slate-500 font-medium">Optometric prescribing · Australia</p>
                </div>
            </button>
            <nav id="main-nav" class="flex flex-wrap items-center gap-1 text-sm font-semibold"></nav>
            <div id="session-status" class="hidden items-center gap-2">
                <div id="timer-display" class="hidden text-sm font-bold bg-amber-50 text-amber-800 py-2 px-4 rounded-full border border-amber-200 tabular-nums"></div>
                <div class="text-sm font-semibold bg-slate-100 py-2 px-4 rounded-full border border-slate-200 text-slate-700">
                    Score: <span id="current-score" class="text-blue-700 font-bold">0</span>
                </div>
                <button onclick="quitSession()" class="text-xs font-bold text-slate-500 hover:text-red-600 px-2 py-2">Exit</button>
            </div>
        </div>
    </header>

    <main id="app-container" class="flex-grow flex flex-col items-center px-4 py-6 sm:p-8 w-full max-w-7xl mx-auto"></main>

    <footer class="text-center text-xs text-slate-400 py-6 px-4">
        Study aid only. Doses, scheduling, PBS listings and OBA/RANZCO requirements change — verify against the current AMH, eTG, product information, OBA guidelines and your course notes.
    </footer>

    <!-- Case bank (split by topic) -->
    <script src="js/data/categories.js"></script>
    <script src="js/data/glaucoma.js"></script>
    <script src="js/data/neuro.js"></script>
    <script src="js/data/cornea.js"></script>
    <script src="js/data/uveitis.js"></script>
    <script src="js/data/allergy.js"></script>
    <script src="js/data/conj.js"></script>
    <script src="js/data/professional.js"></script>
    <script src="js/data/corrections.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
